function previewRender(){let s=stage.statement,ms=stage.movements,isNew=!!stage.newFile;modal(isNew?'Revisar nuevo resumen':'Revisar datos del resumen',notice(isNew?'PDF nuevo: lectura automática pendiente de integración. Completá los campos manualmente y agregá los movimientos. No se inventaron datos.':'Datos precargados desde el PDF adjunto. Revisá contra el original. Los campos modificados quedarán marcados como correcciones manuales.','info')+`<div class="formgrid">${select('Tarjeta','card',cardOptions(s.card))}${field('Período del resumen','period',s.period,'month','required')}${field('Fecha de cierre','close',s.close,'date','required')}${field('Fecha de vencimiento','due',s.due,'date','required')}${moneyfield('Saldo anterior ARS','previous',s.previous,'required')}${moneyfield('Saldo actual ARS','total',s.total,'required')}${moneyfield('Saldo actual USD (sin convertir)','usd',s.usd,'required')}${moneyfield('Pago mínimo ARS','minimum',s.minimum,'required')}${field('TEM de financiación ARS (%)','tem',s.tem==null?'':String(s.tem),'text','inputmode="decimal" placeholder="Vacío si no figura"')}<label class="field">Procedencia<span class="pill ${isNew?'gold':''}">${isNew?'Carga manual desde PDF':'Extraído de PDF'}</span><small>Se conserva el dato original para auditar cambios.</small></label></div><h3 style="margin-top:24px;margin-bottom:12px">Movimientos · ${ms.length}</h3><div class="helptext">Pagos previos: negativos y ya incluidos en el saldo. Intereses, impuestos y débitos: separados por tipo.</div><div class="tablewrap" style="margin-top:10px;max-height:270px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Moneda</th><th>Importe</th><th>Cuota</th><th>Referencia / póliza</th></tr></thead><tbody>${ms.map((m,i)=>`<tr><td><input aria-label="Fecha movimiento ${i+1}" class="tableinput" type="date" data-mi="${i}" data-mf="date" value="${m.date}"></td><td><input aria-label="Concepto movimiento ${i+1}" class="tableinput concept" data-mi="${i}" data-mf="concept" value="${esc(m.concept)}"></td><td><select aria-label="Tipo movimiento ${i+1}" class="tableinput" data-mi="${i}" data-mf="kind">${options(['Consumo','Seguro','Débito a confirmar','Cuota','Interés','Impuesto','Pago del período anterior','Conversión','Ajuste'].map(x=>[x,x]),m.kind)}</select></td><td><select aria-label="Moneda movimiento ${i+1}" class="tableinput" data-mi="${i}" data-mf="currency">${options([['ARS','ARS'],['USD','USD']],m.currency)}</select></td><td><input aria-label="Importe movimiento ${i+1}" class="tableinput" inputmode="decimal" data-mi="${i}" data-mf="amount" value="${raw(m.amount)}"></td><td style="min-width:95px"><input aria-label="Cuota actual movimiento ${i+1}" class="tableinput" style="width:40px" data-mi="${i}" data-mf="current" value="${m.current||''}"> / <input aria-label="Cuotas totales movimiento ${i+1}" class="tableinput" style="width:40px" data-mi="${i}" data-mf="total" value="${m.total||''}"></td><td><input aria-label="Referencia movimiento ${i+1}" class="tableinput" data-mi="${i}" data-mf="ref" value="${esc(m.ref||'')}"></td></tr>`).join('')||'<tr><td colspan="6">Agregá los movimientos para administrar seguros y cuotas.</td></tr>'}</tbody></table></div><div class="quick">${button('Agregar movimiento','addpreview','','small','plus')}${!isNew?button('Ver PDF','original',`data-id="${s.file}"`,'small ghost'):''}</div><label class="checkrow"><input name="reviewcheck" type="checkbox" required> Revisé saldos, fechas, moneda y movimientos. Confirmo esta versión.</label><p class="footnote">Los pagos mínimos informados se conservan una sola vez. Importar un período nuevo no registra un pago ni suma ambos cierres como deudas independientes.</p>`,`<button class="btn primary" type="submit">${isNew?'Confirmar importación':'Guardar revisión'}</button>`,'preview')}
function readPreview(){const f=document.getElementById('modalForm'),s={...stage.statement},newCard=f.elements.card.value;s.card=newCard;for(const k of ['period','close','due'])s[k]=f.elements[k].value;for(const k of ['previous','total','usd','minimum'])s[k]=amount(f.elements[k].value);let t=f.elements.tem.value.trim();s.tem=t===''?null:Number(t.replace(',','.'));if(s.tem!=null&&(!Number.isFinite(s.tem)||s.tem<0||s.tem>100))throw Error('La TEM debe estar entre 0 y 100 %.');const ms=stage.movements.map((m,i)=>{let x={...m,card:newCard};for(const k of ['date','concept','kind','currency','amount','current','total','ref']){let el=f.querySelector(`[data-mi="${i}"][data-mf="${k}"]`);if(!el)continue;x[k]=k==='amount'?amount(el.value,true):k==='current'||k==='total'?(el.value?Number(el.value):null):el.value}if(!x.concept.trim()||!x.date)throw Error('Completá fecha y concepto de cada movimiento.');if(x.kind==='Cuota'&&(!Number.isInteger(x.current)||!Number.isInteger(x.total)||x.current<1||x.current>x.total||x.total>120))throw Error('Revisá los números de las cuotas (actual entre 1 y total, hasta 120).');if(x.kind!=='Cuota'){x.current=null;x.total=null}return x});return {s,ms}}
async function processFiles(files){let pending=[...files];if(!pending.length)return;let reports=[];for(const f of pending){try{if(f.size>15*1024*1024)throw Error('Supera los 15 MB.');const b=await f.arrayBuffer();if(new TextDecoder().decode(b.slice(0,5))!=='%PDF-')throw Error('No es un PDF válido.');const data=arrayBase64(b),hash=globalThis.crypto?.subtle?Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join(''):null;const dupe=originalFiles.find(x=>hash?x.hash===hash:x.data===data)||(state.uploads||[]).find(x=>hash?x.hash===hash:fileMemory.get(x.id)?.data===data);if(dupe){reports.push(f.name+': documento ya cargado.');continue}if(pending.length>1){uploadQueue.push(...pending.slice(pending.indexOf(f)+1));pending=pending.slice(0,pending.indexOf(f)+1)}const id=uid('s'),fileId=uid('pdf');previewModal({id,card:'gv',period:'',close:'',due:'',previous:0,total:0,usd:0,minimum:0,tem:null,source:'Manual desde PDF',file:fileId,reviewed:false},{id:fileId,name:f.name,hash,data,size:f.size});if(reports.length)toast(reports.join(' '));return}catch(e){reports.push(f.name+': '+e.message)}}if(reports.length)toast(reports.join(' '));}
let uploadQueue=[];
function arrayBase64(buffer){let bytes=new Uint8Array(buffer),s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function original(id){if(!id){toast('Esta copia pública no contiene documentos originales.');return}let f=originalFiles.find(f=>f.id===id)||fileMemory.get(id);if(!f&&db)f=await new Promise((res,rej)=>{let r=db.transaction('pdfs').objectStore('pdfs').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!f){toast('Original no disponible en este navegador. Restaurá un respaldo que incluya los PDF.');return}let binary=atob(f.data),bytes=new Uint8Array(binary.length);for(let i=0;i<bytes.length;i++)bytes[i]=binary.charCodeAt(i);download(f.name,bytes,'application/pdf')}
function storePDF(f){fileMemory.set(f.id,f);if(!db)return Promise.resolve(false);return new Promise(resolve=>{let tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(f);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);tx.onabort=()=>resolve(false)})}

function setRate(){let f=document.getElementById('planForm'),s=latest(f.elements.card.value);f.elements.rate.value=s.tem==null?'':String(s.tem);document.getElementById('rateSource').innerHTML=s.tem==null?'El PDF de Mercado Pago informa TNA, pero no una TEM explícita. Ingresá una TEM para simular intereses; no usamos la tasa punitoria.':`TEM ${String(s.tem).replace('.',',')} % extraída del resumen. Podés reemplazarla solo para este escenario.`}
function scenario(){const f=document.getElementById('planForm'),id=f.elements.card.value,s=latest(id),base=balance(s),extra=amount(f.elements.extra.value||'0'),monthly=amount(f.elements.monthly.value||'0'),r=f.elements.rate.value.trim(),rate=r===''?null:Number(r.replace(',','.'));if(extra>base)throw Error('El extraordinario no puede superar el saldo estimado de la tarjeta.');if(rate!=null&&(!Number.isFinite(rate)||rate<0||rate>100))throw Error('Ingresá una TEM entre 0 y 100 %.');return {id,s,base,extra,monthly,rate,strategy:f.elements.strategy.value,name:f.elements.name.value.trim()}}
function project(base,rate,monthly,n=12){let values=[base],interest=0;for(let i=0;i<n;i++){const fee=Math.round(values.at(-1)*rate/100);interest+=fee;values.push(Math.max(0,values.at(-1)+fee-monthly))}return {values,interest}}
function recalcPlan(resetRate=false){if(page!=='plan')return;const f=document.getElementById('planForm');if(!f.dataset.ready||resetRate){setRate();f.dataset.ready='1'}try{let x=scenario(),remaining=x.base-x.extra,total=totalDebt(),progress=x.base?x.extra/x.base*100:0,candidates=state.cards.filter(c=>c.id!==x.id&&latest(c.id)&&balance(latest(c.id))>0).map(c=>({c,s:latest(c.id)}));candidates.sort((a,b)=>x.strategy==='rate'?((b.s.tem??-1)-(a.s.tem??-1)||balance(a.s)-balance(b.s)):(balance(a.s)-balance(b.s)||(b.s.tem??-1)-(a.s.tem??-1)));let next=candidates[0];document.getElementById('planError').textContent='';document.getElementById('planResults').innerHTML=`<span class="helptext">${esc(cname(x.id))} · saldo pendiente estimado</span><div class="value" style="font-size:34px;margin:9px 0 18px">${money(remaining)}</div><div class="lineitem"><span>Saldo antes del extraordinario</span><b>${money(x.base)}</b></div><div class="lineitem"><span>Reducción del saldo</span><b class="green-text">${money(x.extra)}</b></div><div class="lineitem"><span>Capital amortizado</span><span class="dim">No determinable sin imputación bancaria</span></div><div class="lineitem"><span>Interés evitado en un mes completo</span><b>${x.rate==null?'Falta TEM':money(Math.round(x.extra*x.rate/100))}</b></div><div class="lineitem"><span>Deuda total después del extra</span><b>${money(total-x.extra)}</b></div><div class="lineitem"><span>Progreso del escenario sobre esta tarjeta</span><b class="green-text">${progress.toFixed(1).replace('.',',')} %</b></div><div class="progress"><span style="width:${progress}%"></span></div><div class="editnote">Próxima candidata según la regla elegida:<br><strong>${next?esc(cname(next.c.id)):'Sin otra deuda en pesos'}</strong>${next?` · ${money(balance(next.s))}<br>TEM ${next.s.tem==null?'desconocida':next.s.tem+' %'}`:''}</div><p class="footnote">El ahorro de un mes = extraordinario × TEM, suponiendo que todo reduce saldo financiable durante un mes. Es aproximado y no incluye impuestos.</p>`;if(x.rate==null||!x.monthly){document.getElementById('planChart').innerHTML=empty('Definí el aporte mensual para ver la curva','Ingresá un aporte mensual total a esta tarjeta y una TEM. El resto de las tarjetas se mantiene constante solo como referencia.');return}let a=project(x.base,x.rate,x.monthly),b=project(remaining,x.rate,x.monthly),other=total-x.base,va=a.values.map(v=>v+other),vb=b.values.map(v=>v+other),max=Math.max(...va,...vb,1),min=Math.min(...va,...vb,0),W=800,H=210,points=vs=>vs.map((v,i)=>(50+i*59)+','+(180-(v-min)/(max-min)*150)).join(' ');document.getElementById('planChart').innerHTML=`<svg class="chartsvg" viewBox="0 0 800 220" role="img" aria-label="Proyección mensual de deuda total en pesos con y sin pago extraordinario"><line x1="50" y1="180" x2="760" y2="180" stroke="#29415c"/><line x1="50" y1="105" x2="760" y2="105" stroke="#20354d" stroke-dasharray="3 5"/><line x1="50" y1="30" x2="760" y2="30" stroke="#20354d" stroke-dasharray="3 5"/><polyline points="${points(va)}" stroke="#dfb767" fill="none" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${points(vb)}" stroke="#75b4ff" fill="none" stroke-width="3"/>${[0,3,6,9,12].map(i=>`<text x="${50+i*59}" y="207" text-anchor="middle" fill="#a2b6cd" font-size="11">${i===0?'Hoy':'Mes '+i}</text>`).join('')}<text x="50" y="20" fill="#a2b6cd" font-size="10">Máximo ${esc(money(max))}</text></svg><div class="legend"><span><span class="dot" style="background:var(--blue)"></span>Con extraordinario</span><span><span class="dot" style="background:var(--gold)"></span>Sin extraordinario</span></div><div class="splitstats" style="margin-top:20px"><div class="statbox"><small>Total simulado al mes 12</small><b>${money(vb[12])}</b></div><div class="statbox"><small>Intereses evitados · 12 meses</small><b class="green-text">${money(a.interest-b.interest)}</b></div><div class="statbox"><small>Tarjeta objetivo · mes 12</small><b>${money(b.values[12])}</b></div></div>${x.monthly<=Math.round(remaining*x.rate/100)?notice('Con estos supuestos el aporte inicial no cubre los intereses del primer mes; la deuda puede aumentar.'):''}<details><summary>Ver importes mensuales y supuestos</summary><p>Para la tarjeta objetivo: saldo siguiente = máximo(0, saldo anterior + interés redondeado al centavo − aporte). Interés = saldo × TEM. Las otras tarjetas quedan constantes; no es un plan conjunto ni incluye el costo futuro de mantenerlas.</p><div class="tablewrap"><table><thead><tr><th>Mes</th><th class="money">Sin extraordinario · total</th><th class="money">Con extraordinario · total</th></tr></thead><tbody>${va.map((v,i)=>`<tr><td>${i}</td><td class="money">${money(v)}</td><td class="money">${money(vb[i])}</td></tr>`).join('')}</tbody></table></div></details>`}catch(e){document.getElementById('planError').textContent=e.message;document.getElementById('planResults').innerHTML='<p class="dim">Corregí el escenario para calcular.</p>';document.getElementById('planChart').innerHTML=''}}

function linkDerived(ms,s){for(const m of ms){let q=state.installments.find(q=>q.movement===m.id);if(m.current){let data={movement:m.id,card:s.card,concept:m.concept,amount:m.amount,current:m.current,total:m.total,period:s.period,origin:m.origin};if(q)Object.assign(q,data);else state.installments.push({id:uid('q'),...data})}else if(q){state.installments=state.installments.filter(x=>x.id!==q.id)}if(['Seguro','Débito a confirmar'].includes(m.kind)){let i=state.insurances.find(i=>i.charges.includes(m.id));if(!i){i=state.insurances.find(i=>i.ref&&i.ref===m.ref)}if(i){if(!i.charges.includes(m.id))i.charges.push(m.id);if(i.charges.length===1)i.amount=m.amount}else state.insurances.push({id:uid('i'),name:m.concept,ref:m.ref||'',coverage:'',amount:m.amount,card:s.card,decision:'Evaluar',classification:m.kind==='Seguro'?'Seguro':'Por confirmar',note:'',cancelDate:'',history:[],charges:[m.id],origin:m.origin})}}}
async function submitModal(f){const kind=f.dataset.kind,v=Object.fromEntries(new FormData(f));if(kind==='payment'){let s=state.statements.find(s=>s.id===v.statement),a=amount(v.amount);if(a<=0)throw Error('El pago debe ser mayor a cero.');if(v.date<s.close)throw Error('La fecha del pago debe ser igual o posterior al cierre de este resumen. Si ya figura en el PDF, no lo cargues otra vez.');if(v.date>today())throw Error('Un pago realizado no puede tener fecha futura.');if(v.type==='Mínimo'&&(v.currency!=='ARS'||paid(s)>=s.minimum))throw Error('El mínimo de este resumen ya está cubierto o la moneda no es ARS. Usá Parcial o Extraordinario si corresponde a un pago adicional real.');if(v.type==='Mínimo'&&a<s.minimum-paid(s))throw Error('El importe no alcanza el mínimo pendiente; registralo como Parcial.');if(a>balance(s,v.currency))throw Error('El importe supera el saldo estimado pendiente. Revisá la conciliación antes de registrarlo.');if(v.type==='Total'&&a!==balance(s,v.currency))throw Error('Para registrar Total, el importe debe coincidir con el restante estimado en esa moneda.');if(state.payments.some(p=>p.statement===s.id&&p.date===v.date&&p.amount===a&&p.currency===v.currency))throw Error('Ya existe un pago igual para ese resumen y fecha.');state.payments.push({id:uid('p'),statement:s.id,amount:a,currency:v.currency,date:v.date,type:v.type,origin:'Manual',note:v.note,initial:false});audit('Pago registrado',`${cname(s.card)} · ${money(a,v.currency)} · ${v.type}. Registro local, sin transferencia bancaria.`)}
else if(kind==='editpay'){let p=state.payments.find(p=>p.id===dialogContext.payment),s=state.statements.find(s=>s.id===p.statement);if(v.date&&(v.date<s.close||v.date>today()))throw Error('Revisá la fecha: debe estar entre el cierre del resumen y hoy.');p.date=v.date||null;p.note=v.note;audit('Pago informado completado',`${cname(s.card)} · ${money(p.amount,p.currency)} · ${v.date||'sin fecha'}. Sin nuevo descuento.`)}
else if(kind==='insurance'){let old=state.insurances.find(i=>i.id===dialogContext.insurance),a=amount(v.amount);if(a<=0)throw Error('Ingresá un importe mayor a cero.');if(['Baja solicitada','Baja confirmada'].includes(v.decision)&&!v.cancelDate)throw Error('Indicá la fecha de solicitud o confirmación para detectar cargos posteriores.');if(v.cancelDate>today())throw Error('La fecha de baja realizada no puede ser futura.');let i=old||{id:dialogContext.insurance,charges:[],history:[],origin:'Manual'};if(old&&(['name','ref','coverage','card','decision','classification','note','cancelDate'].some(k=>i[k]!==v[k])||i.amount!==a)){i.history.unshift({at:new Date().toISOString(),text:`Tarjeta: ${cname(i.card)} → ${cname(v.card)}. Decisión: ${i.decision} → ${v.decision}. Importe: ${money(i.amount)} → ${money(a)}. Fecha baja: ${i.cancelDate||'sin fecha'} → ${v.cancelDate||'sin fecha'}. Otros campos editados: ${['name','ref','coverage','classification','note'].filter(k=>i[k]!==v[k]).join(', ')||'ninguno'}.`})}Object.assign(i,{...v,amount:a});if(!old)state.insurances.push(i);audit('Seguro actualizado',`${i.name} · ${i.decision} · ${cname(i.card)}. Gestión externa pendiente si corresponde.`)}
else if(kind==='charge'){let i=state.insurances.find(i=>i.id===dialogContext.insurance),a=amount(v.amount),s=latest(v.card);if(a<=0)throw Error('Ingresá un cargo mayor a cero.');if(v.date>today())throw Error('Un cargo realizado no puede ser futuro.');if(!s)throw Error('Cargá primero un resumen de esa tarjeta para poder conciliar el cargo.');if(v.date<=s.close)throw Error('El cargo debe ser posterior al último cierre; para movimientos de ese PDF usá su revisión.');if(state.movements.some(m=>i.charges.includes(m.id)&&m.date===v.date&&m.amount===a&&m.card===v.card))throw Error('Este cargo ya está vinculado.');let m={id:uid('m'),statement:s.id,card:v.card,date:v.date,concept:i.name,ref:i.ref,amount:a,currency:'ARS',kind:'Seguro',origin:'Manual',postClose:true,note:v.note};state.movements.push(m);i.charges.push(m.id);audit('Cargo de seguro registrado',`${i.name} · ${money(a)} · ${date(v.date)}${insuranceAlert(i).length?' · Alerta posterior a baja.':''}`)}
else if(kind==='installment'){let q=state.installments.find(q=>q.id===dialogContext.installment),a=amount(v.amount),cur=Number(v.current),tot=Number(v.total);if(a<=0||!Number.isInteger(cur)||!Number.isInteger(tot)||cur<1||cur>tot||tot>120)throw Error('Revisá importe y cuotas (actual entre 1 y total, hasta 120).');let data={concept:v.concept,card:v.card,amount:a,current:cur,total:tot,period:v.period,origin:'Manual'};if(q)Object.assign(q,data);else state.installments.push({id:dialogContext.installment,...data});audit('Proyección de cuotas actualizada',`${v.concept} · ${cur}/${tot} · ${money(a)} por mes. Sin modificar el saldo de tarjeta.`)}
else if(kind==='expense'){let a=amount(v.amount);if(a<=0)throw Error('El gasto debe ser mayor a cero.');if(v.status==='Pagado'&&v.date>today())throw Error('Un gasto pagado no puede tener fecha futura.');if(v.linkedMovement){let m=state.movements.find(m=>m.id===v.linkedMovement);if(m.amount!==a)throw Error('El importe debe coincidir con el movimiento vinculado. Para divisiones parciales hace falta conciliar antes.');if(state.expenses.some(e=>e.id!==dialogContext.expense&&e.linkedMovement===v.linkedMovement))throw Error('Ese movimiento ya está vinculado a otro gasto.')}if(!v.linkedMovement&&state.movements.some(m=>m.currency==='ARS'&&m.amount===a&&m.date===v.date&&m.concept.trim().toLowerCase()===v.concept.trim().toLowerCase()))throw Error('Hay un movimiento igual en una tarjeta. Vinculalo para no contarlo dos veces.');if(state.expenses.some(e=>e.id!==dialogContext.expense&&e.concept.trim().toLowerCase()===v.concept.trim().toLowerCase()&&e.date===v.date&&e.amount===a))throw Error('Ya existe un gasto igual con esa fecha e importe.');let old=state.expenses.find(e=>e.id===dialogContext.expense),data={...v,amount:a};if(old)Object.assign(old,data);else state.expenses.push({id:dialogContext.expense,...data});audit('Gasto externo guardado',`${v.concept} · ${money(a)} · ${v.linkedMovement?'Vinculado, excluido del total externo':v.status}`)}
else if(kind==='preview'){let {s,ms}=readPreview(),isNew=!!stage.newFile,old=state.statements.find(x=>x.id===s.id);if(!s.close||!s.period||!s.due||s.due<s.close)throw Error('Revisá período, cierre y vencimiento. El vencimiento no puede ser anterior al cierre.');if(s.minimum>s.total&&s.usd===0)throw Error('El mínimo no puede superar el saldo en pesos si no hay deuda USD.');if(!isNew&&s.card!==old.card)throw Error('No se puede cambiar la tarjeta de un resumen con registros vinculados.');if(state.statements.some(x=>x.id!==s.id&&x.card===s.card&&x.period===s.period))throw Error('Ya existe un resumen de esa tarjeta y período. Revisá el existente.');if(!isNew&&(s.total<paid(old)||s.usd<paid(old,'USD')))throw Error('El saldo editado es menor que los pagos registrados. Revisá los pagos antes de guardar.');if(!isNew){let changed=['period','close','due','previous','total','usd','minimum','tem'].filter(k=>old[k]!==s[k]);if(changed.length){s.originalValues=s.originalValues||Object.fromEntries(['period','close','due','previous','total','usd','minimum','tem'].map(k=>[k,old[k]]));audit('Corrección manual de resumen',cname(s.card)+' · '+changed.map(k=>k+': '+old[k]+' → '+s[k]).join('; ')+' (importes almacenados en centavos).')}if(changed.length)s.manualCorrections=[...(s.manualCorrections||[]),...changed];s.source=changed.length?'PDF + corrección manual':old.source;for(let m of ms){let prev=state.movements.find(x=>x.id===m.id);if(prev&&JSON.stringify(prev)!==JSON.stringify(m))m.origin='PDF + corrección manual'}}else for(let m of ms)m.origin='Manual desde PDF';s.reviewed=true;if(isNew){const pdf=stage.newFile,kept=await storePDF(pdf);state.uploads=state.uploads||[];state.uploads.push({id:pdf.id,name:pdf.name,hash:pdf.hash,size:pdf.size,persistent:kept});state.statements.push(s);if(!kept)toast('El PDF nuevo queda en esta sesión. Exportá el respaldo antes de cerrar.')}else Object.assign(old,s);state.movements=state.movements.filter(m=>m.statement!==s.id||m.postClose);state.movements.push(...ms.filter(m=>!m.postClose));linkDerived(ms,s);audit(isNew?'Resumen importado':'Resumen revisado',`${cname(s.card)} · ${month(s.period)} · ${s.source}. No se registró un nuevo pago.`)}
save();closeModal(false);render();toast('Registro guardado.');if(uploadQueue.length){let next=uploadQueue.splice(0);await processFiles(next)}}
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;if(f.id==='modalForm'){try{await submitModal(f)}catch(err){document.getElementById('formError').textContent=err.message}}if(f.id==='planForm'){try{let x=scenario();state.strategies.unshift({id:uid('plan'),at:new Date().toISOString(),card:x.id,base:x.base,totalBase:totalDebt(),extra:x.extra,rate:x.rate,monthly:x.monthly,strategy:x.strategy,name:x.name||'Escenario '+(state.strategies.length+1)});audit('Escenario guardado',`${cname(x.id)} · extraordinario hipotético ${money(x.extra)}. No modifica pagos ni saldos.`,'Simulado');save();render();toast('Escenario guardado. Los pagos reales no cambiaron.')}catch(err){document.getElementById('planError').textContent=err.message}}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='go')go(b.dataset.page);if(a==='menu')document.getElementById('sidebar').classList.toggle('open');if(a==='close')closeModal();if(a==='detail')detail(id);if(a==='detailtab')detail(dialogContext.card,dialogContext.statement,id);if(a==='payment')paymentModal(id);if(a==='editpay')editPay(id);if(a==='upload'){document.getElementById('pdfInput').value='';document.getElementById('pdfInput').click()}if(a==='original')await original(id);if(a==='review')previewModal(state.statements.find(s=>s.id===id));if(a==='insuranceedit')insuranceEdit(id);if(a==='charge')chargeModal(id);if(a==='installmentedit')installmentEdit(id);if(a==='expenseedit')expenseEdit(id);if(a==='backup')await backup();if(a==='restore'){document.getElementById('restoreInput').value='';document.getElementById('restoreInput').click()}if(a==='addpreview'){const x=readPreview();stage.statement=x.s;stage.movements=x.ms;stage.movements.push({id:uid('m'),statement:x.s.id,card:x.s.card,date:x.s.close||today(),concept:'',amount:0,currency:'ARS',kind:'Consumo',current:null,total:null,origin:'Manual desde PDF'});previewRender()}if(a==='voidpay'){let p=state.payments.find(p=>p.id===id);dialogContext={voidpay:id};modal('Anular registro de pago',notice(`Vas a anular el registro de ${money(p.amount,p.currency)} del ${date(p.date)}. El saldo estimado volverá a incluir ese importe. El movimiento de anulación quedará en el historial.`),button('Confirmar anulación','confirmvoid',`data-id="${id}"`,'danger'))}if(a==='confirmvoid'){let p=state.payments.find(p=>p.id===id);if(!p||p.initial)throw Error('No se puede anular este registro.');audit('Registro de pago anulado',`${cname(state.statements.find(s=>s.id===p.statement).card)} · ${money(p.amount,p.currency)} · fecha ${p.date}. Motivo: corrección manual.`);state.payments=state.payments.filter(p=>p.id!==id);save();closeModal();render();toast('Registro anulado.')}if(a==='reset'){modal('Restablecer el prototipo',notice('Se eliminarán los cambios locales de esta prueba y volverán los cinco resúmenes iniciales. Exportá un respaldo para conservar tus registros.'),button('Exportar respaldo','backup','','','download')+button('Restablecer datos','confirmreset','','danger'))}if(a==='confirmreset'){state=initial();fileMemory.clear();if(db)db.transaction('pdfs','readwrite').objectStore('pdfs').clear();save();closeModal();go('overview');toast('Se restauró la base inicial del prototipo.')}if(a==='resetplan'){render()}if(a==='loadplan'){let p=state.strategies.find(x=>x.id===id),f=document.getElementById('planForm');f.elements.card.value=p.card;setRate();for(let k of ['extra','monthly'])f.elements[k].value=raw(p[k]);f.elements.rate.value=p.rate==null?'':p.rate;f.elements.strategy.value=p.strategy;f.elements.name.value=p.name;recalcPlan();window.scrollTo({top:0,behavior:'smooth'});toast('Escenario cargado con los saldos actuales. La versión guardada conserva su base original.')}}catch(err){let el=document.getElementById('formError');if(el&&document.getElementById('dialog').open)el.textContent=err.message;else toast(err.message)}});
document.addEventListener('input',e=>{if(e.target.closest('#planForm'))recalcPlan();if(e.target.closest('.toolbar'))applyFilters()});
document.addEventListener('change',e=>{if(e.target.id==='detailStatement')detail(e.target.dataset.card,e.target.value,detailTab);if(e.target.closest('#planForm'))recalcPlan(e.target.name==='card');if(e.target.closest('.toolbar'))applyFilters();if(e.target.closest('#modalForm')&&['statement','currency','type'].includes(e.target.name))paymentHint()});

document.addEventListener('dragover',e=>{if(page==='imports'){e.preventDefault();document.getElementById('dropzone')?.classList.add('drag')}});document.addEventListener('dragleave',e=>document.getElementById('dropzone')?.classList.remove('drag'));document.addEventListener('drop',e=>{if(page==='imports'){e.preventDefault();document.getElementById('dropzone')?.classList.remove('drag');processFiles(e.dataTransfer.files)}});
document.getElementById('restoreInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>100*1024*1024)throw Error('El respaldo supera 100 MB.');let backup=JSON.parse(await f.text());validateBackup(backup);dialogContext={restore:backup};modal('Restaurar respaldo',notice(`Este respaldo tiene ${backup.state.statements.length} resúmenes y ${backup.state.payments.length} pagos. Reemplazará los registros locales de esta prueba. Los datos actuales se pueden exportar antes.`),button('Exportar actual','backup','','','download')+button('Confirmar restauración','confirmrestore','','primary'));}catch(err){toast('No se pudo leer el respaldo: '+err.message)}});
function validateBackup(b){if(b.format!=='sisventas-personal-prototype'||b.version!==1)throw Error('Formato incompatible.');for(let key of ['cards','statements','movements','payments','insurances','installments','expenses','history','strategies'])if(!Array.isArray(b.state?.[key]))throw Error('El respaldo está incompleto.');const safeID=x=>typeof x==='string'&&/^[a-zA-Z0-9-]+$/.test(x);for(const group of ['cards','statements','movements','payments','insurances','installments','expenses','history','strategies']){let seen=new Set();for(const item of b.state[group]){if(!safeID(item.id)||seen.has(item.id))throw Error('Identificadores inválidos o repetidos.');seen.add(item.id)}}for(const c of b.state.cards)if(!/^#[0-9a-f]{6}$/i.test(c.color))throw Error('Color de tarjeta inválido.');for(const s of b.state.statements){if(!b.state.cards.some(c=>c.id===s.card)||!/^\d{4}-\d{2}-\d{2}$/.test(s.close)||!/^\d{4}-\d{2}$/.test(s.period))throw Error('Referencia de resumen inválida.');for(const k of ['total','usd','minimum','previous'])if(!Number.isSafeInteger(s[k])||s[k]<0)throw Error('Importes inválidos.')}for(const p of b.state.payments)if(!b.state.statements.some(s=>s.id===p.statement)||!Number.isSafeInteger(p.amount)||p.amount<0||!['ARS','USD'].includes(p.currency))throw Error('Pago inválido.');const integerMoney=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e13;const validPeriod=v=>typeof v==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(v);const validDate=v=>typeof v==='string'&&/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(v)&&!Number.isNaN(Date.parse(v));const hasCard=id=>b.state.cards.some(c=>c.id===id);const hasStatement=id=>b.state.statements.some(s=>s.id===id);const hasMovement=id=>b.state.movements.some(m=>m.id===id);for(const s of b.state.statements)if(!validDate(s.close)||!validDate(s.due)||!validPeriod(s.period)||s.due<s.close||(s.tem!=null&&(!Number.isFinite(s.tem)||s.tem<0||s.tem>100)))throw Error('Fechas o tasas de resumen inválidas.');for(const m of b.state.movements)if(!hasCard(m.card)||!hasStatement(m.statement)||!Number.isSafeInteger(m.amount)||Math.abs(m.amount)>1e13||!['ARS','USD'].includes(m.currency)||!validDate(m.date))throw Error('Movimiento inválido.');for(const i of b.state.insurances)if(!hasCard(i.card)||!integerMoney(i.amount)||!Array.isArray(i.history)||!Array.isArray(i.charges)||i.charges.some(id=>!hasMovement(id)))throw Error('Seguro inválido.');for(const q of b.state.installments)if(!hasCard(q.card)||!integerMoney(q.amount)||!validPeriod(q.period)||!Number.isInteger(q.current)||!Number.isInteger(q.total)||q.current<1||q.current>q.total||q.total>120)throw Error('Compra en cuotas inválida.');for(const e of b.state.expenses)if(!integerMoney(e.amount)||!validDate(e.date)||(e.linkedMovement&&!hasMovement(e.linkedMovement)))throw Error('Gasto externo inválido.');for(const x of b.state.strategies)if(!hasCard(x.card)||!integerMoney(x.extra)||!integerMoney(x.monthly)||(x.rate!=null&&(!Number.isFinite(x.rate)||x.rate<0||x.rate>100)))throw Error('Escenario inválido.');for(const f of b.files||[])if(!safeID(f.id)||typeof f.data!=='string'||!f.data.startsWith('JVBERi0'))throw Error('Documento del respaldo inválido.')}
document.addEventListener('click',async e=>{if(e.target.closest('[data-action="confirmrestore"]')){try{let b=dialogContext.restore;for(const f of b.files||[]){if(!originalFiles.some(x=>x.id===f.id))await storePDF(f)}state=b.state;audit('Respaldo restaurado','Se restauraron los datos y documentos incluidos en el respaldo.');save();closeModal();go('overview');toast('Respaldo restaurado.')}catch(err){toast('No se pudo restaurar: '+err.message)}}});
