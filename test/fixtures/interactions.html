<!doctype html><html lang="es" class="sv-v3-preview dark-mode"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/app.css?v=qa9"><link rel="stylesheet" href="css/v3-preview.css?v=qa9"><link rel="stylesheet" href="css/surface-scroll.css?v=qa9"><link rel="stylesheet" href="css/projects.css?v=qa9"><title>Auditoría de interacción local</title><style>body{margin:0;padding:20px;font-family:system-ui}.content{height:75vh;overflow:auto;background:var(--bg2);padding:22px}.qa-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.qa-list{height:1300px;background:linear-gradient(var(--bg2),var(--bg3))}#audit-result{white-space:pre-wrap}.qa-dialog-list{height:1500px;flex-shrink:0;background:linear-gradient(var(--bg2),var(--bg3))}</style><body class="dark-mode"><h2>Comprobación local · datos ficticios</h2><div class="qa-toolbar"><button class="btn" id="confirm">Confirmación</button><button class="btn" id="long">Ventana con lista</button><button class="btn" id="native">Diálogo nativo</button><button class="btn" id="mutations">Comprobar reposo</button></div><output id="audit-result">Sin operaciones reales</output><div class="content" tabindex="0" role="region" aria-label="Fondo desplazable"><button class="btn" id="behind">Acción de fondo</button><div class="qa-list">Fondo desplazable</div></div><script>__SV_COMMON_SOURCE__

let behind=0;const result=document.getElementById('audit-result');document.getElementById('behind').onclick=()=>{behind++;result.textContent='Clics de fondo: '+behind;};document.getElementById('confirm').onclick=async()=>{const value=await svConfirm('Confirmación ficticia. No modifica datos.',{titulo:'Prueba de confirmación'});result.textContent='Resultado: '+value+' · foco: '+document.activeElement.id;};function close(id){document.getElementById(id)?.remove();svSincronizarPilaModales();}document.getElementById('long').onclick=()=>{const o=document.createElement('div');o.id='modal-audit-list';o.className='modal-overlay open';o.setAttribute('role','dialog');o.innerHTML='<section class="modal" tabindex="0" aria-label="Lista desplazable"><header class="modal-head"><strong>Lista de prueba</strong><button class="btn" data-close-list>Cerrar lista</button></header><button class="btn" id="nested">Confirmación sobre lista</button><div class="qa-dialog-list">Contenido largo · desplazar aquí</div></section>';document.body.append(o);o.querySelector('[data-close-list]').onclick=()=>close('modal-audit-list');o.querySelector('#nested').onclick=async()=>{const v=await svConfirm('Confirmación encima de una lista.');result.textContent='Anidada: '+v;};};document.getElementById('native').onclick=()=>{const d=document.createElement('dialog');d.id='audit-native';d.className='px-dialog';d.innerHTML='<header class="px-dialog-head"><h2>Diálogo nativo de prueba</h2><button class="btn" data-close-native>Cerrar nativo</button></header><div class="px-dialog-body"><button class="btn" id="inside-native">Confirmar dentro</button><div style="height:900px">Lista interna</div></div>';document.body.append(d);d.querySelector('[data-close-native]').onclick=()=>close('audit-native');d.showModal();d.querySelector('#inside-native').onclick=async()=>{const v=await svConfirm('La confirmación debe recibir el clic por delante del diálogo nativo.');result.textContent='Nativo: '+v;};};document.getElementById('mutations').onclick=()=>{let count=0;const m=new MutationObserver(r=>count+=r.length);m.observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style']});setTimeout(()=>{m.disconnect();result.textContent='Mutaciones de capas en reposo (500ms): '+count;},500);};</script></html>
