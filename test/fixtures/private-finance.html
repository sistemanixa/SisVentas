<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Prueba local · Gastos personales</title><style>body{margin:0;background:#06111f;color:#edf4fc;font:16px system-ui;padding:24px}button,select{padding:12px;background:#10243b;color:inherit;border:1px solid #dfb767;border-radius:8px;margin:8px}nav{display:flex;gap:12px;flex-wrap:wrap}.note{color:#dfb767}#fixture-status{margin:20px}</style></head><body>
<h1>Prueba local · datos ficticios</h1><p class="note">Sin conexión con Firebase real. Las operaciones usan memoria y desaparecen al reiniciar este servidor.</p>
<label>Identidad de prueba <select id="fixture-user"><option value="owner-fixture">Titular ficticio</option><option value="other-admin">Otro administrador</option><option value="tech">Técnico</option></select></label>
<button id="fixture-view">Activar Ver como</button><button id="fixture-logout">Cerrar sesión de prueba</button>
<nav><button>Gastos laborales (sin cambios)</button><button id="nav-personal-finance" hidden style="display:none" onclick="SVPrivateFinancePortal.open()">Gastos personales</button></nav><div id="fixture-status">Vista anterior de SisVentas · se conserva al volver</div>
<script>window.isAuthenticated=true;window.currentUserUid='owner-fixture';window._impersonacionOriginal=null;window.fbAuth={currentUser:{uid:'owner-fixture',getIdToken:async()=>'owner-fixture'}};window.SISVENTAS_FUNCTIONS={cotizadorProveedor:location.origin};window.notify=text=>document.getElementById('fixture-status').textContent=text;
document.getElementById('fixture-user').onchange=e=>{document.dispatchEvent(new CustomEvent('sisventas:session-ended'));let id=e.target.value;window.isAuthenticated=true;window.currentUserUid=id;window._impersonacionOriginal=null;window.fbAuth.currentUser={uid:id,getIdToken:async()=>id};document.dispatchEvent(new CustomEvent('sisventas:session-ready'));};
document.getElementById('fixture-view').onclick=()=>{window._impersonacionOriginal=window._impersonacionOriginal?null:{user:'Ficticio'};window.SVPrivateFinancePortal.contextChanged();};
document.getElementById('fixture-logout').onclick=()=>{window.isAuthenticated=false;window.fbAuth.currentUser=null;window.currentUserUid='';document.dispatchEvent(new CustomEvent('sisventas:session-ended'));};</script>
<script>window.SV_IA_ENDPOINT=location.origin;if(new URLSearchParams(location.search).has('mobile')){const style=document.createElement('style');style.textContent='#sv-private-finance-space{width:390px!important;max-width:100vw!important;left:50%!important;transform:translateX(-50%)}';document.head.append(style);}</script><script src="js/modules/private-finance-portal.js?v=3.12.3"></script><script>document.dispatchEvent(new CustomEvent('sisventas:session-ready'));</script></body></html>
