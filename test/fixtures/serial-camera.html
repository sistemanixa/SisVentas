<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba local · Lector de series</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/surface-scroll.css"><style>body{margin:0;background:#0b1321;color:#e2e9f3;font:15px system-ui}main{max-width:720px;margin:auto;padding:24px}input,select{box-sizing:border-box;max-width:100%;padding:12px;background:#1c2942;color:#e2e9f3;border:1px solid #34445c;border-radius:9px}label{display:block;margin:20px 0}canvas{width:180px;height:180px;margin:20px 0}#result{overflow-wrap:anywhere}button{min-height:44px}</style>
<main><h1>Lector de series · Prueba local</h1><p>Cámara simulada con códigos de barras y QR. No usa la cámara física, Firebase ni datos reales.</p><label>Ejemplo<select id="example"><option>000001234567</option><option>SERIE-DEMO-002</option><option>NB-2026-XYZ987</option><option value="code128">SN-001 · Código de barras</option><option value="denied">Permiso denegado</option><option value="blank">Sin código · probar cierre</option></select></label><canvas width="360" height="360" aria-label="Etiqueta ficticia"></canvas><label>Serie leída<input id="serial" readonly></label><button class="btn btn-primary" id="scan">Escanear ejemplo</button><p id="result" role="status">Elegí un ejemplo y abrí el lector.</p><p id="camera-state">Cámara detenida</p></main>
<script src="/test/fixtures/serial-code128.js"></script><script src="/js/vendor/zxing/zxing-browser-0.1.5.min.js"></script><script>
// Isolated test page ONLY: generated video substitutes camera permission. The
// production scanner and decoder run unchanged. No real device is requested.
document.body.classList.add('dark-mode');document.documentElement.classList.add('dark-mode');
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),selection=document.querySelector('#example');let stopCount=0;
const shape=document.createElement('select');shape.setAttribute('aria-label','Formato de cámara simulada');for(const [value,label]of [['360x360','Cuadrada'],['360x640','Vertical'],['640x360','Horizontal']]){const option=document.createElement('option');option.value=value;option.textContent=label;shape.append(option);}selection.parentElement.after(shape);shape.onchange=()=>{const [w,h]=shape.value.split('x').map(Number);canvas.width=w;canvas.height=h;draw();};
async function draw(){const w=canvas.width,h=canvas.height,side=Math.min(w,h);ctx.fillStyle='white';ctx.fillRect(0,0,w,h);if(['blank','denied'].includes(selection.value)){ctx.fillStyle='#23475d';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#42738b';for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}return;}if(selection.value==='code128'){const d=serialCode128Fixture;let x=(w-360)/2+20;ctx.fillStyle='black';d.widths.forEach((width,n)=>{if(n%2===0)ctx.fillRect(x,(h-160)/2,width*2,160);x+=width*2;});return;}const svg=new ZXingBrowser.BrowserQRCodeSvgWriter().write(selection.value,side,side);const image=new Image();image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));await image.decode();ctx.drawImage(image,(w-side)/2,(h-side)/2);}
selection.onchange=()=>{document.querySelector('#serial').value='';document.querySelector('#result').textContent='Elegí un ejemplo y abrí el lector.';draw();};draw();
Object.defineProperty(navigator.mediaDevices,'getUserMedia',{value:async()=>{if(selection.value==='denied')throw Object.assign(Error('Prueba'),{name:'NotAllowedError'});await draw();const stream=canvas.captureStream(12);document.querySelector('#camera-state').textContent='Cámara simulada activa';for(const track of stream.getTracks()){const stop=track.stop.bind(track);track.stop=()=>{stop();stopCount++;document.querySelector('#camera-state').textContent='Cámara detenida · '+stopCount+' cierres';};}return stream;}});
Object.defineProperty(navigator.mediaDevices,'enumerateDevices',{value:async()=>[{kind:'videoinput',deviceId:'ficticia',label:'Cámara simulada local'}]});
</script><script src="/js/modules/serial-camera-scanner.js?v=3.11.19"></script><script>
document.querySelector('#scan').onclick=()=>SVSerialCamera.open({label:'Unidad ficticia · '+selection.value,onRead:value=>{document.querySelector('#serial').value=value;document.querySelector('#result').textContent='Lectura correcta: '+value+' · Revisá la serie antes de emitir.';}});
</script></html>
