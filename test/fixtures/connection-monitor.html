<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba local · conexión</title>
<link rel="stylesheet" href="/css/app.css"><body style="background:var(--bg);color:var(--text);padding:32px;font-family:system-ui"><main style="max-width:760px;margin:auto"><div class="card" style="padding:24px"><h1>Prueba de conexión</h1><p>Ejemplo aislado, sin datos reales. El navegador y Firebase siguen indicando conexión durante este corte simulado.</p><div id="fb-status" role="status" style="margin:24px 0;font-weight:600">Reconectando</div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="cut">Simular pérdida de Internet</button><button class="btn" id="restore">Restablecer conexión</button></div></div></main>
<script>var module={exports:{}};</script><script src="/js/core/connection-monitor.js?v=3.12.16"></script><script>
let available=true;const monitor=module.exports.create({online:()=>true,probe:async()=>{if(!available)throw TypeError('Corte ficticio');return 401;},changed(){const v=monitor.view(true),badge=document.getElementById('fb-status');badge.textContent=v.label;badge.title=v.title;badge.style.color=v.connected?'var(--green)':'var(--amber)';}});
document.getElementById('cut').onclick=async()=>{available=false;await monitor.check();};document.getElementById('restore').onclick=async()=>{available=true;await monitor.check();};monitor.check();
</script></body></html>
